<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmiDomi - Perfil</title>
  <link rel="stylesheet" href="perfil.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="perfil-container" id="perfilContainer">

    <!-- ── Header azul ── -->
    <div class="perfil-header">
      <button class="btn-back" onclick="window.location.href='dashboard.html'">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <div class="perfil-info">
        <div class="avatar-wrapper">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop&crop=face" alt="Foto de perfil">
        </div>
        <div class="perfil-texto">
          <h2 id="perfilNombre">Cargando...</h2>
          <p id="perfilCorreo">-</p>
        </div>
      </div>

      <button class="btn-edit" id="btnEditar" title="Editar perfil" disabled>
        <i class="fa-regular fa-pen-to-square"></i>
      </button>
    </div>

    <!-- ── Datos del cliente: en lectura se muestran; en edición aparecen los campos ── -->
    <div class="perfil-opciones">

      <div class="perfil-campo">
        <i class="fa-regular fa-user"></i>
        <label for="inputNombre">Nombre</label>
        <span class="valor" id="valorNombre">-</span>
        <input type="text" id="inputNombre" maxlength="100" autocomplete="given-name">
      </div>

      <div class="perfil-campo">
        <i class="fa-regular fa-user"></i>
        <label for="inputApellido">Apellido</label>
        <span class="valor" id="valorApellido">-</span>
        <input type="text" id="inputApellido" maxlength="100" autocomplete="family-name">
      </div>

      <div class="perfil-campo">
        <i class="fa-regular fa-envelope"></i>
        <label for="inputCorreo">Correo</label>
        <span class="valor" id="valorCorreo">-</span>
        <input type="email" id="inputCorreo" maxlength="150" autocomplete="email">
      </div>

      <div class="perfil-campo">
        <i class="fa-solid fa-phone"></i>
        <label for="inputTelefono">Teléfono</label>
        <span class="valor" id="valorTelefono">-</span>
        <input type="tel" id="inputTelefono" maxlength="20" autocomplete="tel">
      </div>

      <div class="perfil-campo">
        <i class="fa-solid fa-location-dot"></i>
        <label for="inputDireccion">Dirección</label>
        <span class="valor" id="valorDireccion">-</span>
        <input type="text" id="inputDireccion" maxlength="255" autocomplete="street-address">
      </div>

      <div class="perfil-campo">
        <i class="fa-solid fa-city"></i>
        <label for="inputCiudad">Ciudad</label>
        <span class="valor" id="valorCiudad">-</span>
        <input type="text" id="inputCiudad" maxlength="100" autocomplete="address-level2">
      </div>

    </div>

    <!-- Botones de edición: solo visibles en modo edición -->
    <div class="perfil-acciones">
      <button type="button" id="btnCancelar" class="btn-perfil btn-perfil-secundario">Cancelar</button>
      <button type="button" id="btnGuardar" class="btn-perfil btn-perfil-principal">Guardar</button>
    </div>

    <div style="padding: 16px;">
      <button id="btnCerrarSesion" style="width:100%; padding:12px; border:none; border-radius:10px; background:#d9534f; color:#fff; font-weight:bold; cursor:pointer;">Cerrar sesión</button>
      <p id="perfilMsg" style="margin-top:10px; color:#666;"></p>
    </div>

  </div>

  <script src="script.js"></script>
  <script src="perfil.js"></script>
</body>
</html>
