<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmiDomi - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="app-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <nav>
        <a href="dashboard.html" class="nav-item active">
          <i class="fa-solid fa-house"></i>
          <span>Inicio</span>
        </a>
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-border-all"></i>
          <span>Pedidos</span>
        </a>
        <a href="perfil.html" class="nav-item">
          <i class="fa-regular fa-user"></i>
          <span>Perfil</span>
        </a>
      </nav>
    </aside>

    <!-- ── Contenido principal ── -->
    <main class="main-content">

      <!-- Header -->
      <header class="top-bar">
        <div class="logo-center">
          <img src="img/logo.png" alt="EmiDomi">
        </div>
        <div class="cart-icon">
          <i class="fa-solid fa-cart-shopping"></i>
        </div>
      </header>

      <!-- Buscador -->
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Buscar restaurantes o comidas">
      </div>

      <!-- Categorías -->
      <section class="categories">
        <div class="category-item active">
          <div class="category-icon">🍔</div>
          <span>Comidas rápidas</span>
        </div>
        <div class="category-item">
          <div class="category-icon">🥤</div>
          <span>Bebidas</span>
        </div>
        <div class="category-item">
          <div class="category-icon">🍨</div>
          <span>Postres</span>
        </div>
        <div class="category-item">
          <div class="category-icon">🥑</div>
          <span>Fruver</span>
        </div>
      </section>

      <!-- Filtros -->
      <div class="filters">
        <button class="filter-btn active">TODOS</button>
        <button class="filter-btn open">ABIERTOS</button>
        <button class="filter-btn closed">CERRADOS</button>
      </div>

      <!-- Restaurantes -->
      <section id="restaurantsSection" class="restaurants">
        <p id="restaurantsMsg" style="color:#666; margin:10px 0;">Cargando restaurantes...</p>
        <div id="restaurantsList"></div>
      </section>

      <!-- Productos del restaurante -->
      <section id="productsSection" class="products" style="display:none;">
        <div class="products-header">
          <button id="btnBackToRestaurants" class="btn-back-rest"><i class="fa-solid fa-arrow-left"></i> Volver a restaurantes</button>
          <h2 id="productsTitle" class="products-title"></h2>
        </div>
        <p id="productsMsg" style="color:#666; margin:10px 0;"></p>
        <div id="productsList"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
